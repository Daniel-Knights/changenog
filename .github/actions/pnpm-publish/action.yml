name: "PNPM Publish"
description: "Stage package for NPM publishing using PNPM (requires manual approval with 2FA)"
inputs:
  package_dir:
    description: "Directory containing package to publish"
    required: true
  npm_auth_token:
    description: "NPM authentication token"
    required: true
runs:
  using: "composite"
  steps:
    - uses: pnpm/setup@v3
      with:
        runtime: node@22
        require-lockfile: true
        install: false

    - name: Stage package for NPM publishing
      shell: bash
      run: pnpm stage publish ${{ inputs.package_dir }} --no-git-checks --access public
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm_auth_token }}
        NPM_CONFIG_PROVENANCE: true
